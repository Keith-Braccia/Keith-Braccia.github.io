<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAZE: Edge Rush — Free on the App Store</title>
<meta name="apple-itunes-app" content="app-id=6785326186">
<meta property="og:title" content="GRAZE: Edge Rush">
<meta property="og:description" content="Score by almost dying. One tap arcade game. Free on the App Store.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #06141c 0%, #02080c 60%, #01050a 100%);
    color: #e8f6ff; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 36px 24px; gap: 14px;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: .06em; text-shadow: 0 0 34px rgba(232,246,255,.5); }
  .sub { font-size: 12px; font-weight: 600; letter-spacing: .42em; color: #28e0ff;
         text-indent: .42em; margin-top: -6px; }
  .card { width: 100%; max-width: 340px; margin-top: 20px; padding: 20px;
    border: 1px solid rgba(40,224,255,.35); border-radius: 16px; background: rgba(40,224,255,.07); }
  .card h2 { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: #28e0ff; margin-bottom: 12px; }
  .card p { font-size: 15px; line-height: 1.75; }
  .card b { color: #fff; }
  .btn { display: block; width: 100%; max-width: 340px; margin-top: 12px; padding: 17px 24px;
    border-radius: 13px; text-decoration: none; font-size: 16px; font-weight: 700;
    border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #e8f6ff; }
  .btn.go { border-color: rgba(40,224,255,.6); background: rgba(40,224,255,.14);
            box-shadow: 0 0 24px rgba(40,224,255,.22); }
  .btn:active { opacity: .7; }
  .or { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .45; margin-top: 18px; }
  .note { font-size: 15px; color: #fff; opacity: .95; margin-top: 10px; max-width: 320px;
          line-height: 1.7; font-weight: 500; }
  .note b { color: #28e0ff; font-weight: 700; letter-spacing: .02em; }
  .award { margin: 16px auto 22px; text-align: center; }
.award img { max-width: 100%; height: auto; display: inline-block; }
.awardText {
  margin: 0; color: #ffd479; letter-spacing: .02em;
  font: 600 15px/1.4 -apple-system, system-ui, sans-serif;
}
</style>
</head>
<body>
  <h1>GRAZE</h1>
  <div class="sub">EDGE RUSH</div>
  <!-- PixelPicked #1 Launch Week -->
<div class="award">
  <img src="https://api.pixelpicked.com/api/badges/3aPZlUnoF71/rank/1/live.png?week=July+Week+4"
       width="250" height="54"
       alt="#1 Game Launch of the Week, PixelPicked"
       onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'awardText',textContent:'#1 Game Launch of the Week · PixelPicked'}))">
</div>

  <div class="card" id="card" style="display:none">
    <h2>One quick step</h2>
    <p>Tap <b>&#8943;</b> at the top right, then <b>&ldquo;Open in external browser&rdquo;</b>.<br>
       Instagram blocks App Store links inside its own browser.</p>
  </div>

  <a class="btn go" id="primary" href="https://apps.apple.com/app/id6785326186">Open in the App Store</a>
  <button class="btn" id="copy">Copy the link</button>

  <div class="or">or</div>
  <p class="note">Search <b>GRAZE Edge Rush</b> in the App Store. It's free.</p>

<script>
(function () {
  var ID = "6785326186";
  var HTTPS = "https://apps.apple.com/app/id" + ID;
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isInApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|TikTok|Snapchat|Line\//i.test(ua);

  if (isInApp) {
    // Meta's webview sandboxes custom URL schemes, so the only dependable path
    // is getting the user out of it. Lead with that instruction instead of
    // auto-navigating, which just lands them on a blank App Store page.
    document.getElementById("card").style.display = "block";
  } else if (isIOS) {
    setTimeout(function () { window.location.href = HTTPS; }, 300);
  } else {
    setTimeout(function () { window.location.href = HTTPS; }, 500);
  }

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    var done = function () { btn.textContent = "Link copied ✓"; setTimeout(function(){ btn.textContent = "Copy the link"; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(HTTPS).then(done, done);
    } else {
      var t = document.createElement("textarea");
      t.value = HTTPS; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t); done();
    }
  });
})();
</script>
</body>
</html>
