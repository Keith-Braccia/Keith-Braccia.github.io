<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAZE: Edge Rush — Free on the App Store</title>
<meta name="apple-itunes-app" content="app-id=6785326186">
<meta property="og:title" content="GRAZE: Edge Rush">
<meta property="og:description" content="Score by almost dying. One tap arcade game. Free on the App Store.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #06141c 0%, #02080c 60%, #01050a 100%);
    color: #e8f6ff; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 36px 24px; gap: 12px;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: .06em; text-shadow: 0 0 34px rgba(232,246,255,.5); }
  .sub { font-size: 12px; font-weight: 600; letter-spacing: .42em; color: #28e0ff;
         text-indent: .42em; margin-top: -6px; }
  .tag { font-size: 14px; opacity: .7; line-height: 1.6; max-width: 320px; margin-top: 6px; }
  .btn { display: block; width: 100%; max-width: 340px; margin-top: 14px; padding: 18px 24px;
    border-radius: 13px; text-decoration: none; font-size: 17px; font-weight: 700;
    border: 1px solid rgba(40,224,255,.6); background: rgba(40,224,255,.14);
    color: #e8f6ff; box-shadow: 0 0 24px rgba(40,224,255,.22); }
  .btn.alt { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.06);
             box-shadow: none; font-size: 15px; font-weight: 600; }
  .btn:active { opacity: .7; }
  .card { width: 100%; max-width: 340px; margin-top: 18px; padding: 16px 18px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(255,255,255,.04); }
  .card p { font-size: 13px; line-height: 1.75; opacity: .75; }
  .card b { color: #28e0ff; opacity: 1; }
  .note { font-size: 12px; opacity: .4; margin-top: 12px; max-width: 300px; line-height: 1.6; }
  .note b { color: #fff; opacity: .8; }
</style>
</head>
<body>
  <h1>GRAZE</h1>
  <div class="sub">EDGE RUSH</div>
  <p class="tag">Score by almost dying. Free, no in-app purchases.</p>

  <!-- Real user tap on the full (non-shortened) App Store URL. target=_blank
       asks the in-app browser to hand off externally. -->
  <a class="btn" id="primary"
     href="https://apps.apple.com/app/id6785326186"
     target="_blank" rel="noopener">Download on the App Store</a>

  <button class="btn alt" id="copy">Copy the link</button>

  <div class="card" id="card" style="display:none">
    <p>Still nothing? Tap <b>&#8943;</b> top right &rarr; <b>Open in external browser</b>.</p>
  </div>

  <p class="note">or search <b>GRAZE Edge Rush</b> in the App Store</p>

<script>
(function () {
  var HTTPS = "https://apps.apple.com/app/id6785326186";
  var ua = navigator.userAgent || "";
  var isInApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|TikTok|Snapchat|Line\//i.test(ua);

  // Only show the escape instructions where they're actually needed, and never
  // auto-navigate inside an in-app browser — that's what caused the blank page
  // and wiped out the buttons before they could be tapped.
  if (isInApp) {
    document.getElementById("card").style.display = "block";
  } else {
    setTimeout(function () { window.location.href = HTTPS; }, 300);
  }

  document.getElementById("copy").addEventListener("click", function () {
    var b = this;
    var done = function () { b.textContent = "Link copied ✓"; setTimeout(function(){ b.textContent = "Copy the link"; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(HTTPS).then(done, done);
    else { var t=document.createElement("textarea"); t.value=HTTPS; document.body.appendChild(t); t.select();
           try{document.execCommand("copy");}catch(e){} document.body.removeChild(t); done(); }
  });
})();
</script>
</body>
</html>
